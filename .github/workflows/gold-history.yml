name: Chennai gold rates

# livechennai.com does not allow browser requests, so this job copies its
# 22K / 24K rates into data/chennai-gold.json for the site to read.
on:
  schedule:
    - cron: '7,37 3-13 * * *'   # every 30 min, 08:37 to 19:07 India time
    - cron: '17 15,19,23 * * *' # a few checks overnight
  workflow_dispatch:
    inputs:
      all:
        description: 'Fetch every month since 2006'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gold-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch rates
        run: node scripts/update-gold-history.mjs ${{ inputs.all && '--all' || '' }}
      - name: Commit if changed
        run: |
          git add data/chennai-gold.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Chennai gold rates"
          git push
